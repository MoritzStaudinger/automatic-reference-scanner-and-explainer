# Automatic Reference Scanner and Explainer
# Deployment targets: reference-cleaner.ds-ifs.tuwien.ac.at
#                     arse.ds-ifs.tuwien.ac.at
#
# Only nginx is exposed on the host (80 + 443).  ares, ares-api and grobid
# talk over the compose-internal network.  See DEPLOY.md for the full
# runbook; `scripts/deploy.sh` performs and verifies a deploy.
#
# TLS: institutional (TU Wien / GEANT) certificates, no certbot.  nginx
# picks the certificate per hostname (SNI), so each hostname gets its own
# cert + key mount below.  Paths come from .env:
#
#   TLS_CERT / TLS_KEY            reference-cleaner.ds-ifs.tuwien.ac.at
#   ARSE_TLS_CERT / ARSE_TLS_KEY  arse.ds-ifs.tuwien.ac.at
#
# The ARSE_* variables default to the reference-cleaner files, which is
# right once the certificate's SAN list covers both names.  Every cert
# file must be the FULL CHAIN (leaf + GEANT intermediate) — see
# scripts/build_fullchain.sh.  Renewal: replace the files on the host,
# then `docker compose restart nginx`.

services:

  grobid:
    # CRF-only build — skips DeLFT (deep-learning) initialization, which
    # is what the app uses anyway.
    image: lfoppiano/grobid:0.9.0-crf
    container_name: ares-grobid
    restart: unless-stopped
    # The JVM heap is 2 GB, but GROBID's native PDF layer allocates outside
    # it: one 3 MB paper peaked at ~3.8 GB total.  At 4g the container was
    # OOM-killed under concurrent parses (the "random parsing failures").
    mem_limit: 6g
    environment:
      - JAVA_OPTS=-Xmx2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      # GROBID loads 12 Wapiti models + warms up the JVM on first boot;
      # on a modest VM this takes 3-5 minutes.
      retries: 10
      start_period: 240s

  ares:
    build: .
    image: ares:latest
    container_name: ares-app
    restart: unless-stopped
    depends_on:
      grobid:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # In-container service discovery — overrides any GROBID_URL in .env
      - GROBID_URL=http://grobid:8070
      - ARES_CACHE=/app/data/cache.sqlite
    volumes:
      # SQLite lookup cache, persists across restarts.
      - ares-data:/app/data
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Headless HTTP API (api.py) for programmatic / batch use.  Same image,
  # uvicorn entry point.  Shares the cache volume with the UI.  Without
  # ARES_API_KEY or a keys file it answers 503 to everything but /healthz.
  ares-api:
    build: .
    image: ares:latest
    container_name: ares-api
    restart: unless-stopped
    depends_on:
      grobid:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - GROBID_URL=http://grobid:8070
      - ARES_CACHE=/app/data/cache.sqlite
      - ARES_JOBS_DB=/app/data/jobs.sqlite
      - ARES_API_KEYS_FILE=/app/data/api_keys.json
    volumes:
      - ares-data:/app/data
    mem_limit: 4g
    command: ["uvicorn", "api:app",
              "--host", "0.0.0.0",
              "--port", "8500",
              "--workers", "1",
              "--proxy-headers",
              "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8500/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: ares-nginx
    restart: unless-stopped
    depends_on:
      ares:
        condition: service_healthy
      ares-api:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # One cert/key pair per hostname, read-only.  create_host_path:
      # false makes a wrong path fail loudly instead of Docker silently
      # creating an empty directory in its place.
      - type: bind
        source: ${TLS_CERT:-/etc/ssl/reference-cleaner.pem}
        target: /etc/nginx/certs/reference-cleaner.ds-ifs.tuwien.ac.at.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TLS_KEY:-/etc/ssl/key.pem}
        target: /etc/nginx/certs/reference-cleaner.ds-ifs.tuwien.ac.at.key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ARSE_TLS_CERT:-${TLS_CERT:-/etc/ssl/reference-cleaner.pem}}
        target: /etc/nginx/certs/arse.ds-ifs.tuwien.ac.at.pem
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ARSE_TLS_KEY:-${TLS_KEY:-/etc/ssl/key.pem}}
        target: /etc/nginx/certs/arse.ds-ifs.tuwien.ac.at.key
        read_only: true
        bind: {create_host_path: false}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ares-data:
