<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Selector</title>
  <style>
    /* Light defaults; main.js overrides these from the Streamlit theme. */
    :root {
      --bg: #f4f6fa;
      --fg: #1b2330;
      --panel: #ffffff;
      --line: #dfe3ea;
      --hover: #eef1f6;
      --accent: #2754c5;
      --accent-hover: #1f46a8;
      --muted: #6b7280;
    }
    html.dark {
      --bg: #0f1420;
      --fg: #e6e9ef;
      --panel: #181f2e;
      --line: #2a3346;
      --hover: #222b3d;
      --muted: #9aa3b2;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
    }

    /* ─────────  Sticky toolbar  ───────── */
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    #toolbar button {
      padding: 6px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--fg);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    #toolbar button:hover:not(:disabled) { background: var(--hover); }
    #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    #page-label {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 64px;
      text-align: center;
    }
    /* The prominent "+ Add" button — always visible, label changes by state */
    /* Backlink target: outline that pulses, then fades. */
    .focus-flash {
      position: absolute;
      border: 3px solid var(--accent);
      border-radius: 4px;
      pointer-events: none;
      box-shadow: 0 0 0 4px rgba(39, 84, 197, 0.25);
      animation: focus-flash 2.4s ease-out forwards;
    }
    @keyframes focus-flash {
      0%, 15%, 35% { opacity: 1; }
      25% { opacity: 0.35; }
      100% { opacity: 0; }
    }
    #add-btn {
      background: var(--accent) !important;
      color: white !important;
      border: none !important;
      font-weight: 600;
      padding: 7px 16px !important;
      margin-left: auto;
    }
    #add-btn:hover:not(:disabled) { background: var(--accent-hover) !important; }
    #add-btn:disabled { background: #9ca3af !important; opacity: 0.7; cursor: default; }
    #status-text {
      flex-basis: 100%;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-top: 4px;
    }
    #status-text b { color: var(--fg); }

    /* ─────────  Two panes: reference list | PDF  ─────────
       The list lives inside the component so filtering, searching,
       opening cards and jumping to the PDF never cost a Streamlit rerun. */
    /* Summary tiles above the panes (References / Verified / …); a click
       filters the list.  Body is a column so the panes fill what is left. */
    body { display: flex; flex-direction: column; height: 100vh; }
    #tiles { flex: 0 0 auto; display: grid; gap: 10px; padding: 2px 1px 12px;
             grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
    #tiles[hidden] { display: none; }
    .tile { text-align: left; border: 1px solid var(--line); background: var(--panel);
            color: var(--fg); border-radius: 10px; padding: 9px 14px 10px; font: inherit;
            cursor: pointer; transition: background .1s, border-color .1s; }
    .tile:hover:not(:disabled) { background: var(--hover); }
    .tile:disabled { cursor: default; opacity: .6; }
    .tile[aria-pressed="true"] { border-color: var(--accent);
                                 box-shadow: inset 0 0 0 1px var(--accent); }
    .tile .t-label { display: block; font-size: 13px; color: var(--muted); }
    .tile .t-value { display: block; font-size: 28px; line-height: 1.25;
                     font-variant-numeric: tabular-nums; }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #app { display: flex; flex: 1; min-height: 0; }
    #list-pane { flex: 0 0 44%; min-width: 0; display: flex; flex-direction: column;
                 border-right: 1px solid var(--line); background: var(--bg); }
    #list-pane[hidden] { display: none; }
    #viewer-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #list-controls { padding: 10px 12px 6px; display: flex; flex-direction: column; gap: 8px;
                     border-bottom: 1px solid var(--line); }
    #status-filter { display: flex; flex-wrap: wrap; gap: 0; }
    #status-filter button { border: 1px solid var(--line); background: var(--panel); color: var(--fg);
                            padding: 5px 11px; font-size: 13px; cursor: pointer; margin-left: -1px; }
    #status-filter button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
    #status-filter button:last-child { border-radius: 0 8px 8px 0; }
    #status-filter button[aria-pressed="true"] { background: var(--accent); color: #fff;
                                                 border-color: var(--accent); position: relative; }
    #search { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit;
              font-size: 13px; background: var(--panel); color: var(--fg); }
    #list-controls label { font-size: 13px; display: flex; gap: 6px; align-items: center;
                           cursor: pointer; }
    #list-count { font-size: 12px; color: var(--muted); }
    #list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 24px; position: relative; }
    .item { margin-bottom: 10px; scroll-margin-top: 8px; }
    .item.flash .refcard { outline: 3px solid var(--accent); outline-offset: 1px;
                           transition: outline-color 1.5s; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 2px 0 0 4px; }
    .actions button { background: none; border: 0; padding: 2px 0; font: inherit; font-size: 12.5px;
                      color: var(--accent); cursor: pointer; }
    .actions button:hover { text-decoration: underline; }
    .actions button:disabled { color: var(--muted); cursor: default; text-decoration: none; }
    .empty { color: var(--muted); font-size: 13px; padding: 12px 2px; }
    @media (max-width: 760px) {
      #tiles { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
      .tile { padding: 6px 10px; }
      .tile .t-value { font-size: 20px; }
      #app { flex-direction: column; }
      #list-pane { flex: 0 0 auto; max-height: 48vh; border-right: 0;
                   border-bottom: 1px solid var(--line); }
    }

    /* ─────────  Scrollable page container  ───────── */
    #pages-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: auto;
      padding: 8px 0 24px 0;
    }
    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .pdf-page {
      position: relative;
      background: white;
      flex: 0 0 auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    /* ─────────  Text layer (PDF.js v4 TextLayer compatible) ───────── */
    .text-layer {
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden;
      line-height: 1;
      text-align: initial;
      forced-color-adjust: none;
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto;
      cursor: text;
      transform-origin: 0% 0%;
    }
    /* PDF.js sets per-span position, font-family, font-size, and
       transform: scaleX(...) inline.  We must NOT override transform
       or transform-origin here — that's what makes the invisible
       selection bounds match the visible canvas-rendered text width. */
    .text-layer span,
    .text-layer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .text-layer ::selection {
      background: rgba(37, 99, 235, 0.30);
      color: transparent;
    }
    .text-layer ::-moz-selection {
      background: rgba(37, 99, 235, 0.30);
      color: transparent;
    }
  </style>
</head>
<body>
  <style id="cards-css"></style>
  <div id="tiles" role="group" aria-label="Summary — click to filter the list" hidden></div>
  <div id="app">
  <aside id="list-pane" hidden>
    <div id="list-controls">
      <div id="status-filter" role="group" aria-label="Filter by status"></div>
      <input id="search" type="search" placeholder="Search title, author, venue …"
             aria-label="Search references">
      <label><input type="checkbox" id="page-only"> Only references on the visible PDF page</label>
      <div id="list-count"></div>
    </div>
    <div id="list" aria-live="polite"></div>
  </aside>
  <section id="viewer-pane">
  <div id="toolbar">
    <button id="page-prev" title="Previous page">←</button>
    <span id="page-label">– / –</span>
    <button id="page-next" title="Next page">→</button>
    <button id="add-btn" disabled>➕ Add selected text as reference</button>
    <div id="status-text">Tip: drag-select an unhighlighted reference in the PDF, then click the button.</div>
  </div>
  <div id="pages-wrap">
    <div id="pages">Loading PDF…</div>
  </div>
  </section>
  </div>

  <script src="./streamlit-component-lib.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
