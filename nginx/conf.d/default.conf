# ARSE — reference-cleaner.ds-ifs.tuwien.ac.at + arse.ds-ifs.tuwien.ac.at
#
# Certificates are mounted by docker-compose.yml as
#   /etc/nginx/certs/<hostname>.pem   (full chain: leaf + intermediate)
#   /etc/nginx/certs/<hostname>.key
# One server block per hostname with static paths: the root master process
# reads the (root-only) keys at startup.  Shared settings live in
# /etc/nginx/conf.d/arse-common.inc.

# Per-client limits for the public, login-free instance.  A Streamlit page
# load fetches ~30 static files at once, hence the generous burst on "/".
limit_req_zone  $binary_remote_addr zone=ares_ui:10m  rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ares_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ares_conn:10m;
limit_req_status  429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;

# Resolve upstreams through Docker's DNS at request time.  A literal
# hostname in proxy_pass is resolved once at startup, so recreating the
# arse / arse-api containers (new IPs) on deploy left nginx answering 502
# until it was restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# Plain HTTP → HTTPS for our names; anything else is dropped.
server {
    listen 80;
    server_name reference-cleaner.ds-ifs.tuwien.ac.at
                www.reference-cleaner.ds-ifs.tuwien.ac.at
                arse.ds-ifs.tuwien.ac.at;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    # Container healthcheck (compose) — local only.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name reference-cleaner.ds-ifs.tuwien.ac.at
                www.reference-cleaner.ds-ifs.tuwien.ac.at;
    ssl_certificate     /etc/nginx/certs/reference-cleaner.ds-ifs.tuwien.ac.at.pem;
    ssl_certificate_key /etc/nginx/certs/reference-cleaner.ds-ifs.tuwien.ac.at.key;
    include /etc/nginx/conf.d/arse-common.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name arse.ds-ifs.tuwien.ac.at;
    ssl_certificate     /etc/nginx/certs/arse.ds-ifs.tuwien.ac.at.pem;
    ssl_certificate_key /etc/nginx/certs/arse.ds-ifs.tuwien.ac.at.key;
    include /etc/nginx/conf.d/arse-common.inc;
}
