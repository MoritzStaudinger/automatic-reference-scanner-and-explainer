# reference-cleaner.ds-ifs.tuwien.ac.at
#
# TLS via an institutional cert (TU Wien-issued).  The cert + key are
# bind-mounted into /etc/nginx/certs/ by docker-compose.yml — see the
# notes there for the expected filenames.

server {
    listen 80;
    server_name reference-cleaner.ds-ifs.tuwien.ac.at;

    # Plain HTTP → forward everything to HTTPS.  No ACME challenge path
    # needed (institutional cert, no certbot).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name reference-cleaner.ds-ifs.tuwien.ac.at;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Streamlit can stream large reports and PDF previews.  Default
    # client_max_body_size is 1m which would 413 every PDF upload.
    # Batch API uploads can carry many PDFs in one request — bump high.
    client_max_body_size 500m;

    # -----------------------------------------------------------------
    # HTTP API — POST /api/v1/process, /api/v1/batch, ...
    #
    # Routed FIRST so it doesn't get caught by the catch-all "/" block
    # below.  nginx matches longest prefix.
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://ares-api:8500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sync /api/v1/process can take minutes for an uncached paper.
        # Batch endpoints return fast (job_id) but /results may stream a
        # large body — 10 min covers both.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Allow streaming /results.jsonl responses through without
        # buffering the whole batch in nginx.
        proxy_buffering off;
    }

    # Also expose the API's bare health endpoint at /api-health for
    # easy curl from outside (Streamlit owns /_stcore/health and Docker
    # owns /healthz inside the API container).
    location = /api-health {
        proxy_pass http://ares-api:8500/healthz;
    }

    location / {
        proxy_pass http://ares:8501;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit uses a WebSocket for the live UI (`/_stcore/stream`).
        # Without these two headers the page loads but never updates.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Long-running PDF parses + lookups can take 30-60s.  Default
        # nginx proxy_read_timeout is 60s — bump to 5 minutes so users
        # don't see a 504 on the first uncached lookup.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
