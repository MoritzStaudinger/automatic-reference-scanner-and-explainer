# Local-dev overrides.  Opt in explicitly:
# (Not auto-merged, so it can never leak host ports onto the prod VM.)
#
# What this adds:
#   Host-port forwards for the three app services so you can hit them
#   directly without going through nginx (which needs a TU Wien-issued
#   PEM the dev box doesn't have).
#
# NOTE: this file does NOT disable nginx — Compose merges arrays
# additively, so you can't "clear" a service's ports/volumes from an
# override.  Start the dev stack explicitly without nginx:
#
#   docker compose up -d --build grobid ares ares-api
#
# Then open:
#   Streamlit UI : http://localhost:8501
#   HTTP API     : http://localhost:8500/healthz
#   GROBID       : http://localhost:8070/api/isalive  (debugging only)
#
# Tear down with the same restricted set:
#   docker compose down

services:

  grobid:
    ports:
      - "8070:8070"

  ares:
    ports:
      - "8501:8501"

  ares-api:
    ports:
      - "8500:8500"
